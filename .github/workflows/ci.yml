name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install editable package and development tools
        run: python -m pip install -e '.[dev,export]'
      - name: Run full test suite
        run: python -m pytest -q
      - name: Check installed dependencies
        run: python -m pip check

  package:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist and wheel from sdist
        run: python -m build
      - name: Check distribution metadata and README
        run: python -m twine check --strict dist/*
      - name: Smoke-test all installation routes without Scanpy
        run: python scripts/smoke_install.py
