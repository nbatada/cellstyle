name: R backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  r-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Configure isolated R library
        run: |
          mkdir -p .r-library
          echo "R_LIBS_USER=${{ github.workspace }}/.r-library" >> "$GITHUB_ENV"
      - name: Check shared version
        run: python3 scripts/sync_r_version.py --check
      - name: Install system libraries for native exports
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev libxml2-dev libpng-dev ghostscript poppler-utils fonts-dejavu-core
      - name: Install backend dependencies
        run: Rscript -e 'install.packages(c("ggplot2", "rlang", "ggbeeswarm", "ggrepel", "jsonlite", "digest", "systemfonts", "xml2", "svglite"))'
      - name: Build package
        run: R CMD build r/cellstyle
      - name: Install independently built package
        run: |
          mkdir -p .r-library
          R CMD INSTALL --library=.r-library cellstyle_*.tar.gz
      - name: Check package
        env:
          R_LIBS_USER: ${{ github.workspace }}/.r-library
        run: R CMD check --no-manual cellstyle_*.tar.gz
      - name: Render synthetic composition smoke
        env:
          R_LIBS_USER: ${{ github.workspace }}/.r-library
        run: Rscript scripts/r_backend_smoke.R
      - name: Upload R source package
        uses: actions/upload-artifact@v4
        with:
          name: cellstyle-r-${{ github.sha }}
          path: cellstyle_*.tar.gz
          if-no-files-found: error
