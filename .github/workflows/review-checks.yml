name: Correctness checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[scanpy]' pytest
      - run: python -m pytest -q
      - run: python -m pip check
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("ggplot2", "rlang", "ggbeeswarm", "ggrepel"))'
      - run: R CMD build r/cellstyle
      - run: R CMD check --no-manual cellstyle_*.tar.gz
